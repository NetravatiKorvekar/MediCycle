<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicineShare - Verify OTP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-text"><span class="blue-text">medi</span><span class="green-text">cycle</span></div>
            </div>
            <p>Verify Your Identity</p>
        </div>

        <div class="forms-container">
            <!-- Verify OTP Form -->
            <form method="POST" action="{{ url_for('verify_otp') }}" class="form active" id="verify-otp-form">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="otp-info">
                    <p>Enter the 6-digit code sent to your email</p>
                </div>

                <div class="form-group">
                    <label for="otp">OTP Code</label>
                    <input type="text" id="otp" name="otp" class="form-control otp-input"
                        placeholder="000000" maxlength="6" pattern="\d{6}" required>
                </div>

                <button type="submit" class="btn btn-primary" id="verify-otp-button">Verify OTP</button>

                <button type="button" id="resendBtn" class="btn btn-secondary" onclick="resendOTP()" style="display: none;">
                    Resend OTP
                </button>

                <div class="timer">
                    <p>OTP expires in: <span id="countdown">10:00</span></p>
                </div>

                <div class="form-footer">
                    <a href="{{ url_for('forgot_password') }}">← Back</a>
                </div>
            </form>
        </div>
    </div>

    <style>
        .alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            animation: slideDown 0.3s ease-out;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .otp-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .otp-info p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .otp-input {
            text-align: center;
            font-size: 24px !important;
            letter-spacing: 10px;
            font-weight: 600;
        }

        .btn-secondary {
            background-color: #6c757d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .timer {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
        }

        .timer p {
            color: #666;
            font-size: 14px;
            margin: 0;
        }

        .timer span {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 16px;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .form-footer a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }
    </style>

    <script>
        // OTP input formatting
        const otpInput = document.getElementById('otp');
        otpInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Form control animation
        const formControls = document.querySelectorAll('.form-control');
        formControls.forEach(control => {
            control.addEventListener('focus', () => {
                control.style.borderColor = 'var(--primary-color)';
                control.style.boxShadow = '0 0 0 3px rgba(33, 150, 243, 0.25)';
            });

            control.addEventListener('blur', () => {
                control.style.boxShadow = 'none';
                if (!control.value) {
                    control.style.borderColor = 'var(--gray)';
                }
            });
        });

        // Button hover animation
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.transform = 'translateY(-2px)';
                button.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)';
            });

            button.addEventListener('mouseleave', () => {
                button.style.transform = 'translateY(0)';
                button.style.boxShadow = '';
            });
        });

        // Countdown timer
        let timeLeft = 600; // 10 minutes in seconds
        const countdownElement = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');
        let timerInterval;

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                countdownElement.textContent = 'Expired';
                countdownElement.style.color = '#dc3545';
                resendBtn.style.display = 'block';
                clearInterval(timerInterval);
            }
            timeLeft--;
        }

        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // Resend OTP function
        function resendOTP() {
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            fetch('{{ url_for("resend_otp") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('New OTP sent successfully!');
                    // Reset timer
                    timeLeft = 600;
                    resendBtn.style.display = 'none';
                    countdownElement.style.color = 'var(--primary-color)';
                    clearInterval(timerInterval);
                    timerInterval = setInterval(updateTimer, 1000);
                    updateTimer();
                } else {
                    alert('Error sending OTP: ' + data.message);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend OTP';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending OTP. Please try again.');
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend OTP';
            });
        }

        // Form submission
        const form = document.getElementById('verify-otp-form');
        form.addEventListener('submit', (e) => {
            const button = document.getElementById('verify-otp-button');
            button.disabled = true;
            button.textContent = 'Verifying...';
        });
    </script>
</body>

</html>
