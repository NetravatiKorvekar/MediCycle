<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicineShare - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-text"><span class="blue-text">medi</span><span class="green-text">cycle</span></div>
            </div>
            <p>Reset Your Password</p>
        </div>

        <div class="forms-container">
            <form method="POST" action="{{ url_for('forgot_password') }}" class="form active" id="forgot-password-form">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                        placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="btn btn-primary" id="send-otp-button">Send OTP</button>

                <div class="form-footer">
                    <a href="{{ url_for('login_signup') }}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <style>
        .alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            animation: slideDown 0.3s ease-out;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
        }

        .form-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .form-footer a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }
    </style>

    <script>
        const formControls = document.querySelectorAll('.form-control');
        formControls.forEach(control => {
            control.addEventListener('focus', () => {
                control.style.borderColor = 'var(--primary-color)';
                control.style.boxShadow = '0 0 0 3px rgba(33, 150, 243, 0.25)';
            });

            control.addEventListener('blur', () => {
                control.style.boxShadow = 'none';
                if (!control.value) {
                    control.style.borderColor = 'var(--gray)';
                }
            });
        });

        const button = document.querySelector('.btn');
        button.addEventListener('mouseenter', () => {
            button.style.transform = 'translateY(-2px)';
            button.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)';
        });

        button.addEventListener('mouseleave', () => {
            button.style.transform = 'translateY(0)';
            button.style.boxShadow = '';
        });

        const form = document.getElementById('forgot-password-form');
        form.addEventListener('submit', (e) => {
            const button = document.getElementById('send-otp-button');
            button.disabled = true;
            button.textContent = 'Sending OTP...';
        });
    </script>
</body>

</html>
